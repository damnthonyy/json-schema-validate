name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test:run

      - name: Setup npm credentials (npm.org)
        run: npm config set //registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}

      - name: Setup npm credentials (GitHub Packages)
        run: npm config set //npm.pkg.github.com/:_authToken=${{ secrets.JSV_PACKAGES_TOKEN }}

      - name: Publish to npm.org
        run: npm publish --registry https://registry.npmjs.org/

      - name: Publish to GitHub Packages
        run: npm publish --registry https://npm.pkg.github.com --access public
