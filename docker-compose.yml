version: '3.8'

services:
  validator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: json-schema-validator
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    volumes:
      - ./rules:/app/dist/rules:ro
    networks:
      - validator-network

networks:
  validator-network:
    driver: bridge
